name: Build ISO
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm grub-pc-bin xorriso mtools
      - run: |
          cat > boot.asm <<'EOF'
          [BITS 32]
          section.multiboot
          dd 0x1BADB002
          dd 0
          dd -0x1BADB002
          section.text
          global _start
          _start:
            mov esp, 0x90000
            mov esi, msg
            mov edi, 0xB8000
          loop1:
            lodsb
            test al, al
            jz halt
            stosb
            mov byte [edi], 0x0E
            inc edi
            jmp loop1
          halt:
            cli
            hlt
            jmp halt
          msg db 66, 114, 111, 79, 83, 32, 82, 117, 110, 110, 105, 110, 103, 33, 0
          EOF
          nasm -f elf32 boot.asm -o kernel.bin
          mkdir -p iso/boot/grub
          cp kernel.bin iso/boot/
          echo 'menuentry "BroOS" { multiboot /boot/kernel.bin }' > iso/boot/grub/grub.cfg
          grub-mkrescue -o BroOS.iso iso
      - uses: actions/upload-artifact@v4
        with:
          name: BroOS-ISO
          path: BroOS.iso
