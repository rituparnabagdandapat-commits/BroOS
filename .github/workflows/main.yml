name: Build ISO
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y nasm grub-pc-bin xorriso mtools
      - run: |
          mkdir -p iso/boot/grub
          printf 'MBALIGN equ 1<<0\nMEMINFO equ 1<<1\nFLAGS equ MBALIGN | MEMINFO\nMAGIC equ 0x1BADB002\nCHECKSUM equ -(MAGIC + FLAGS)\nsection .multiboot\n.align 4\ndd MAGIC\ndd FLAGS\ndd CHECKSUM\nsection .text\nglobal _start\n_start:\ncli\nmov esp, 0x90000\nmov esi, msg\nmov ebx, 0xB8000\n.loop:\nlodsb\ntest al, al\njz .halt\nmov ah, 0x0E\nmov [ebx], ax\nadd ebx, 2\njmp .loop\n.halt:\
